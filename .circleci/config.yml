version: 2.1

jobs:
  LEN9:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Compute digest v3
          command: |
            mkdir -p /tmp/tmp2
            set +o pipefail 2>/dev/null; { echo "id,hash"; seq 1 1472304 | awk '{print $1","sprintf("%08x",$1*31)}' ; } > /tmp/tmp2/014747_2016; true
            echo "artifact A ok"
      - persist_to_workspace:
          root: /tmp/tmp2
          paths:
            - '014747_2016'
  anothr-run:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/tmp2
      - run:
          name: Check workspace state
          command: |
            tr -dc 'a-z' < /tmp/tmp2/014747_2016 2>/dev/null | fold -w 1 | sort | uniq -c | sort -rn | head -5 || true
      - run:
          name: Fetch HEAD
          command: git clone --depth 2 -q --no-single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unroll archive
          command: tar --extract --xz --file=deps-repo.tar.xz
      - run:
          name: Collect artifacts
          command: sleep 45
      - run:
          command: ./fuel-qa
  sgdSGDGlyph:
